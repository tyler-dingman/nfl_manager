name = "down-distance-api-local"
main = "workers/api/dist/worker.mjs"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false
[vars]
APP_DATA_BACKEND = "d1"
APP_RUNTIME = "cloudflare"
INFRASTRUCTURE_COST_POLICY = "zero-cost"
[[d1_databases]]
binding = "APP_DB"
database_name = "phase-four-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "workers/content-engine/migrations"
remote = false
[[r2_buckets]]
binding = "APP_OBJECTS"
bucket_name = "phase-four-local-objects"
remote = false
[[r2_buckets]]
binding = "APP_BACKUP"
bucket_name = "phase-four-local-backup"
remote = false
[observability]
enabled = false

[[services]]
binding = "PASSWORD_SERVICE"
service = "down-distance-password-local"
