# LOCAL REVIEW ONLY: account safety and owner deployment approval are outstanding.
account_id = "6e8c301360ab628706dcf3acf55f0dbb"
# REVIEW TEMPLATE: replace synthetic IDs only after remote-resource approval.
# Release review template; synthetic IDs and isolated secrets must be replaced after approval.
name = "down-distance-rc3-staging-api"
main = "../workers/api/dist/worker.mjs"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false
[vars]
APP_PASSWORD_ENABLED = "true"
APP_PUBLIC_CACHE_ENABLED = "false"
APP_CACHE_VERSION = "rc3-hosted-review"
PRELAUNCH_MODE = "false"
CONTENT_AUTOMATION_GLOBAL_ENABLED = "false"
APP_ODDS_FETCH_ENABLED = "false"
APP_EDITORIAL_EMAIL_ENABLED = "false"
APP_MAIL_ENABLED = "false"
SEARCH_ANSWER_PROVIDER = "deterministic"

APP_MULTI_D1 = "true"
APP_OBJECT_BACKEND = "d1"
APP_DATA_BACKEND = "d1"
APP_RUNTIME = "cloudflare"
INFRASTRUCTURE_COST_POLICY = "zero-cost"
[triggers]
crons = []
[observability]
enabled = false
[[services]]
binding = "PASSWORD_SERVICE"
service = "down-distance-rc3-staging-password"

