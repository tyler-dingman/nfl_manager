name = "down-distance-review-odds-processor"
main = "../workers/application/odds-processor.ts"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false
[[d1_databases]]
binding = "APP_DB"
database_name = "review-placeholder"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../workers/content-engine/migrations"
remote = false
[[r2_buckets]]
binding = "APP_OBJECTS"
bucket_name = "review-placeholder"
remote = false
[[r2_buckets]]
binding = "APP_BACKUP"
bucket_name = "review-backup-placeholder"
remote = false
[observability]
enabled = false
