# Existing isolated staging resources only; manual reviewed deployment; exposure disabled.
account_id = "6e8c301360ab628706dcf3acf55f0dbb"
name = "down-distance-rc3-staging-web"
main = "../workers/staging/render-origin.ts"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false
minify = true
[vars]
DD_TRANSACTION_BOUNDARY = "true"
STAGING_ACCESS_HOST = "down-distance-rc3-staging-web.tdingman5.workers.dev"
RENDER_STAGING_ORIGIN = "https://nfl-manager.onrender.com"
STAGING_ACCESS_EXPIRES_AT = "2026-10-21T06:00:00Z"
[assets]
# Source-public files at the edge; build-specific Next chunks pass through the
# authenticated origin, so independent Node builds cannot mix chunk generations.
directory = "../public"
binding = "ASSETS"
run_worker_first = true
[[services]]
binding = "API_SERVICE"
service = "down-distance-rc3-staging-api"
[triggers]
crons = []
[observability]
enabled = false

[[d1_databases]]
binding = "D1_USERS"
database_name = "dd-rc3-staging-9"
database_id = "e8dd0780-47a4-47d5-8b52-b5d018825c57"
remote = false
