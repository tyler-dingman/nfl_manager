name = "down-distance-staging-api"
main = "../workers/api/dist/worker.mjs"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false
[vars]
APP_DATA_BACKEND = "d1"
APP_RUNTIME = "cloudflare"
INFRASTRUCTURE_COST_POLICY = "zero-cost"
APP_PASSWORD_ENABLED = "false"
APP_PUBLIC_CACHE_ENABLED = "false"
APP_CACHE_VERSION = "review-required"
PRELAUNCH_MODE = "true"
[[d1_databases]]
binding = "APP_DB"
database_name = "review-placeholder"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "../workers/content-engine/migrations"
remote = false
[[r2_buckets]]
binding = "APP_OBJECTS"
bucket_name = "review-placeholder-objects"
remote = false
[[r2_buckets]]
binding = "APP_BACKUP"
bucket_name = "review-placeholder-backup"
remote = false
[observability]
enabled = false

[triggers]
crons = []

[[services]]
binding = "PASSWORD_SERVICE"
service = "down-distance-staging-password"
