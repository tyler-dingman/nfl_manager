<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="title desc" fill="none">
  <title id="title">Grain Halftone Overlay</title><desc id="desc">Repeating neutral halftone dots for low-opacity overlays.</desc>
  <defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="white" opacity=".32"/><circle cx="8" cy="7" r=".65" fill="white" opacity=".18"/></pattern></defs><rect width="400" height="400" fill="url(#dots)"/>
</svg>
