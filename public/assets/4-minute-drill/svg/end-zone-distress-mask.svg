<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 720" role="img" aria-labelledby="title desc" fill="none">
  <title id="title">End Zone Distress Mask</title><desc id="desc">Tintable distressed end-zone mask with diagonal striping.</desc>
  <defs><pattern id="stripe" width="42" height="42" patternUnits="userSpaceOnUse" patternTransform="rotate(42)"><rect width="20" height="42" fill="white" opacity=".75"/></pattern><filter id="rough"><feTurbulence baseFrequency=".045" numOctaves="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter></defs><rect x="8" y="8" width="224" height="704" rx="4" fill="white" opacity=".88" filter="url(#rough)"/><rect x="8" y="8" width="224" height="704" fill="url(#stripe)" opacity=".28"/>
</svg>
