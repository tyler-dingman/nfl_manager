<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc" fill="none">
  <title id="title">Player Marker Ring</title><desc id="desc">Glowing player marker ring/target; tint the complete asset with CSS mask or currentColor.</desc>
