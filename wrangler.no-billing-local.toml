name = "down-distance-web-local"
main = "workers/web/index.ts"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false
minify = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
APP_OBJECT_BACKEND = "d1"
APP_DATA_BACKEND = "d1"
APP_RUNTIME = "cloudflare"
INFRASTRUCTURE_COST_POLICY = "zero-cost"

[[d1_databases]]
binding = "APP_DB"
database_name = "phase-four-local"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "workers/content-engine/migrations"
remote = false

[observability]
enabled = false

[[services]]
binding = "API_SERVICE"
service = "down-distance-api-local"
