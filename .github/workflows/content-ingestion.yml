name: Content and video ingestion

on:
  # Manual backup only: Cloudflare owns scheduled ingestion to avoid duplicate wakeups.
  workflow_dispatch:
    inputs:
      group:
        description: Pipeline to run
        type: choice
        options: [both, standard, video]
        default: both
      check_only:
        description: Verify deployment authentication without ingesting
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: content-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [standard, video]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test ingestion authentication safeguards
        run: node --test scripts/content-ingestion-request.test.mjs
      - name: Run ${{ matrix.group }} ingestion
        if: inputs.group == 'both' || inputs.group == matrix.group
        env:
          BASE_URL: ${{ secrets.CONTENT_AUTOMATION_BASE_URL }}
          AUTOMATION_SECRET: ${{ secrets.CONTENT_AUTOMATION_SECRET }}
          GROUP: ${{ matrix.group }}
          CHECK_ONLY: ${{ inputs.check_only }}
        run: node scripts/content-ingestion-request.mjs
