name: Three & Out daily briefing

on:
  schedule:
    # Evaluate IANA-local delivery times all day; generate missing daily briefings on demand.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      action:
        description: Generate, deliver, or check deployment readiness
        required: true
        default: generate
        type: choice
        options:
          - generate
          - deliver
          - check

concurrency:
  group: three-and-out-daily
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate or deliver daily briefings
        env:
          BASE_URL: ${{ secrets.CONTENT_AUTOMATION_BASE_URL }}
          AUTOMATION_SECRET: ${{ secrets.CONTENT_AUTOMATION_SECRET }}
          MANUAL_ACTION: ${{ inputs.action }}
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ -z "$BASE_URL" ]; then
            echo "::error::CONTENT_AUTOMATION_BASE_URL is not configured in repository Actions secrets."
            exit 1
          fi
          if [ -z "$AUTOMATION_SECRET" ]; then
            echo "::error::CONTENT_AUTOMATION_SECRET is not configured in repository Actions secrets."
            exit 1
          fi
          case "$BASE_URL" in
            http://*|https://*) ;;
            *)
              echo "::error::CONTENT_AUTOMATION_BASE_URL must be a complete http:// or https:// URL."
              exit 1
              ;;
          esac

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            action="$MANUAL_ACTION"
          else
            action="deliver"
          fi
          curl --fail-with-body --retry 2 --request POST \
            --header "Authorization: Bearer $AUTOMATION_SECRET" \
            "${BASE_URL%/}/api/automation/three-and-out?action=$action"
