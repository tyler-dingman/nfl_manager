# Local-only integration configuration. Application migration is INCOMPLETE; never deploy this file.
name = "down-distance-multi-d1-local"
main = "workers/api/dist/worker.mjs"
compatibility_date = "2026-10-18"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
preview_urls = false
send_metrics = false
[vars]
APP_MULTI_D1 = "true"
APP_OBJECT_BACKEND = "d1"
APP_DATA_BACKEND = "d1"
APP_RUNTIME = "cloudflare"
INFRASTRUCTURE_COST_POLICY = "zero-cost"
[triggers]
crons = []
[observability]
enabled = false
[[services]]
binding = "PASSWORD_SERVICE"
service = "down-distance-password-local"

[[d1_databases]]
binding = "D1_TEAM_1"
database_name = "dd-multi-synthetic-1"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "workers/multi-d1/migrations/team"
remote = false

